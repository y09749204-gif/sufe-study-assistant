name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sufe
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: sufe_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sufe:test-only-password@127.0.0.1:5432/sufe_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r apps/api/requirements-dev.txt
      - run: python -m pytest -q
      - run: npm ci --prefix integrations/kzkt-browser
      - run: npx --prefix integrations/kzkt-browser playwright-core install --with-deps chromium
      - run: node --test integrations/kzkt-browser/*.test.mjs
      - run: npm ci --prefix apps/web
      - run: npm run typecheck --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: python scripts/check-publication.py
